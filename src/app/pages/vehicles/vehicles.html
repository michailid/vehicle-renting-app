<div class="page-content vehicles-page">
  <section class="page-top">
    <div>
      <h1>Vehicles</h1>
    </div>

    <a class="primary-btn" routerLink="add"><i class="fa fa-plus"></i>&nbsp; Add New Car</a>
  </section>

  <section class="vehicles-grid" aria-label="Vehicle list">
    @for (car of cars(); track car) {
      <article class="vehicle-card">
        <div class="vehicle-image-wrap">
          <img [src]="car.carImage" [alt]="car.brand" />
          <span class="status-badge">Available</span>
        </div>

        <div class="vehicle-body">
          <div class="vehicle-header">
            <div>
              <p class="meta-label">Brand</p>
              <h3>{{ car.brand }}</h3>
            </div>
            <span class="price">₹{{ car.dailyRate }}/day</span>
          </div>

          <div class="vehicle-specs">
            <div>
              <span class="spec-label">Model</span>
              <strong>{{ car.model }}</strong>
            </div>
            <div>
              <span class="spec-label">Year</span>
              <strong>{{ car.year }}</strong>
            </div>
            <div>
              <span class="spec-label">Color</span>
              <strong>{{ car.color }}</strong>
            </div>
          </div>

          <div class="vehicle-footer">
            <div>
              <span class="spec-label">Registration</span>
              <strong>{{ car.regNo }}</strong>
            </div>
          </div>
        </div>

        <div class="vehicle-actions">
          <a class="secondary-btn" routerLink="{{ car.carId }}/edit">Edit</a>
          <a class="delete-btn" (click)="onDeleteVehicle(car.carId)">Delete</a>
          <a class="primary-btn" href="/bookings/new">Book</a>
        </div>
      </article>
    }
  </section>
</div>
