<div class="page-shell">
  <div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="add-car-card shadow-lg">
          <div class="row g-0">
            <div class="col-lg-4 left-panel">
              <div class="brand-box">
                <div class="brand-mark">
                  <i class="fa fa-car-side"></i>
                </div>
                <div>
                  <h1>VehicleRenting</h1>
                </div>
              </div>

              <div class="info-box">
                <h2>Add New Car</h2>
                <p>
                  Register a new vehicle to the fleet and make it available for booking instantly.
                </p>
              </div>
            </div>

            <div class="col-lg-8 right-panel">
              <div class="header-row">
                <div>
                  <h3>Vehicle Details</h3>
                </div>
              </div>

              <form class="vehicle-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="brand">Brand</label>
                    <input
                      id="brand"
                      class="form-control"
                      [(ngModel)]="newVehicleObj.Brand"
                      name="brand"
                      type="text"
                      placeholder="e.g. Tata Motors"
                    />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="model">Model</label>
                    <input
                      id="model"
                      class="form-control"
                      [(ngModel)]="newVehicleObj.Model"
                      name="model"
                      type="text"
                      placeholder="e.g. Sumo"
                    />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="year">Year</label>
                    <input
                      id="year"
                      class="form-control"
                      [(ngModel)]="newVehicleObj.Year"
                      name="year"
                      type="number"
                      min="2000"
                      placeholder="2025"
                    />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="color">Color</label>
                    <input
                      id="color"
                      class="form-control"
                      [(ngModel)]="newVehicleObj.Color"
                      name="color"
                      type="text"
                      placeholder="e.g. Red"
                    />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="dailyRate">Daily Rate</label>
                    <div class="input-group">
                      <span class="input-group-text">₹</span>
                      <input
                        id="dailyRate"
                        class="form-control"
                        [(ngModel)]="newVehicleObj.DailyRate"
                        name="dailyRate"
                        type="number"
                        min="0"
                        placeholder="2000"
                      />
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="regNo">Registration Number</label>
                    <input
                      id="regNo"
                      class="form-control"
                      [(ngModel)]="newVehicleObj.RegNo"
                      name="regNo"
                      type="text"
                      placeholder="MH-12QA-3412"
                    />
                  </div>

                  <div class="col-12">
                    <label class="form-label" for="carImage">Car Image URL</label>
                    <input
                      id="carImage"
                      class="form-control"
                      [(ngModel)]="newVehicleObj.CarImage"
                      name="carImage"
                      type="url"
                      placeholder="https://example.com/car-image.jpg"
                    />
                  </div>
                </div>

                <div class="action-row">
                  <button type="button" class="btn btn-light btn-cancel" (click)="onCancel()">Cancel</button>
                  <button type="button" class="btn btn-primary btn-save" (click)="onSaveVehicle()">
                    <i class="fa fa-floppy-disk"></i> Save Car
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
